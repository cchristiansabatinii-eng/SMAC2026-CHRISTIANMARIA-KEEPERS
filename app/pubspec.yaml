name: keepers
description: Offline-first family memory rituals, built for SMAC Summer 2026.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  app_links: ^7.2.1
  audioplayers: ^6.8.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_ble_peripheral: 3.1.0
  flutter_blue_plus: 2.3.12
  flutter_riverpod: ^3.4.2
  humation_flutter: 0.1.0
  flutter_secure_storage: ^11.0.0
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  share_plus: ^13.3.0
  sqflite_sqlcipher: ^3.4.1
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common: ^2.5.11
  sqflite_common_ffi: ^2.4.2+1

# Keep the audited 3.1.0 API pin while using the in-repo native lifecycle fixes.
dependency_overrides:
  flutter_ble_peripheral:
    path: packages/flutter_ble_peripheral

flutter:
  uses-material-design: true
  assets:
    - assets/brand/keepers-wordmark.png
    - assets/brand/keepers-launch-wordmark.png
    - assets/backgrounds/keepers-background-flat.png
    - assets/memories/weekly_reference_1.png
    - assets/memories/weekly_reference_2.png
    - assets/memories/weekly_reference_3.png
    - assets/textures/observatory-grain.png
  fonts:
    - family: ModernSociety
      fonts:
        - asset: assets/fonts/modern_society/modernsociety-regular.otf
